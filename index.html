<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#060a14">
    <title>Para ti, mi amor</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="css/components.css">
    <style type="text/tailwindcss">
        @theme {
            --color-verde: #2f5d3a;
            --color-verde-oscuro: #163024;
            --color-verde-medio: #4a7c59;
            --color-verde-hoja: #6aa06f;
            --color-salvia: #9db5a5;
            --color-salvia-claro: #d7e4c9;
            --color-crema: #faf6ec;
            --color-crema-2: #f0e6cf;
            --color-dorado: #b8935a;
            --color-dorado-claro: #e3c896;
            --color-tinta: #39503f;
            --color-tierra: #8a6f4d;
            --color-noche: #060a14;

            --font-script: 'Great Vibes', cursive;
            --font-serif: 'Cormorant Garamond', serif;
            --font-display: 'Playfair Display', serif;
        }

        @layer base {
            * { box-sizing: border-box; }
            body.hs-cursor-ativo * { cursor: none !important; }
            html { -webkit-text-size-adjust: 100%; }
            body {
                margin: 0; padding: 0;
                background: radial-gradient(ellipse at 20% 0%, rgba(74,124,89,0.06), transparent 50%),
                            radial-gradient(ellipse at 80% 100%, rgba(184,147,90,0.04), transparent 50%),
                            #060a14;
                min-height: 100vh;
            }
        }
    </style>
</head>

<body class="relative min-h-dvh w-full overflow-x-hidden font-serif">

    <!-- ============ LOADER ============ -->
    <div id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Preparando algo especial</div>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>

    <!-- ============ CURSOR ============ -->
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <!-- ============ PROGRESS BAR ============ -->
    <div id="progress-bar"></div>

    <!-- ============ AURORA ============ -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="aurora-blob aurora-1"></div>
        <div class="aurora-blob aurora-2"></div>
        <div class="aurora-blob aurora-3"></div>
    </div>

    <!-- ============ LAYERS ============ -->
    <div id="capa-particulas" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>
    <div id="capa-corazones" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>
    <div class="fixed inset-0 pointer-events-none z-20" id="capaExplosion"></div>

    <!-- ============ PORTADA ============ -->
    <div class="portada" id="portada">

        <svg class="hoja animate-flotar-hoja" style="position:absolute; left:8%; top:12%; width:clamp(40px,8vw,56px); transform:rotate(-18deg);" viewBox="0 0 40 40">
            <defs><linearGradient id="h1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6aa06f" /><stop offset="100%" stop-color="#2f5d3a" /></linearGradient></defs>
            <path d="M20 2 C 31 11, 34 26, 20 38 C 6 26, 9 11, 20 2 Z" fill="url(#h1)" />
        </svg>
        <svg class="hoja animate-flotar-hoja" style="position:absolute; right:8%; top:8%; width:clamp(36px,7vw,48px); transform:rotate(20deg); animation-delay:800ms;" viewBox="0 0 40 40">
            <defs><linearGradient id="h2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4a7c59" /><stop offset="100%" stop-color="#163024" /></linearGradient></defs>
            <path d="M20 2 C 31 11, 34 26, 20 38 C 6 26, 9 11, 20 2 Z" fill="url(#h2)" />
        </svg>
        <svg class="hoja animate-flotar-hoja" style="position:absolute; left:15%; bottom:15%; width:clamp(30px,6vw,40px); transform:rotate(24deg); animation-delay:1.6s;" viewBox="0 0 40 40">
            <defs><linearGradient id="h3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#9db5a5" /><stop offset="100%" stop-color="#4a7c59" /></linearGradient></defs>
            <path d="M20 2 C 31 11, 34 26, 20 38 C 6 26, 9 11, 20 2 Z" fill="url(#h3)" />
        </svg>
        <svg class="hoja animate-flotar-hoja" style="position:absolute; right:12%; bottom:10%; width:clamp(32px,6.5vw,44px); transform:rotate(-28deg); animation-delay:2.4s;" viewBox="0 0 40 40">
            <defs><linearGradient id="h4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#9db5a5" /><stop offset="100%" stop-color="#2f5d3a" /></linearGradient></defs>
            <path d="M20 2 C 31 11, 34 26, 20 38 C 6 26, 9 11, 20 2 Z" fill="url(#h4)" />
        </svg>

        <div class="tarjeta-portada" id="tarjetaPortada" role="button" tabindex="0" aria-label="Abrir la carta">

            <div class="monograma">
                <span>J</span>
            </div>

            <div class="portada-titulo">Para Ti, mi vida</div>
            <div class="portada-nombre">Lisbeth</div>

            <div class="portada-badge">
                <span>&#127807;</span>
                <span>Futura Ingeniera Ambiental</span>
            </div>

            <div class="portada-typed"><span id="textoTipo"></span></div>

            <div class="portada-cta">
                <span>Toca para abrir</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12l7 7 7-7"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- ============ SCRIPTS ============ -->
    <script src="js/config.js"></script>
    <script src="js/swal.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/counter.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/floating.js"></script>
    <script src="js/explosion.js"></script>
    <script src="js/letter.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
